<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panjika — আজকের পঞ্জিকা</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#7a2e2e">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Tiro+Bangla&display=swap" rel="stylesheet">
<style>
  :root {
    --maroon: #7a2e2e;
    --maroon-dark: #5a1f1f;
    --gold: #c89b3c;
    --cream: #fdf6ec;
    --text: #2b2320;
    --text-soft: #6b5f56;
    --card-bg: #ffffff;
    --border: #ecdfc9;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--cream);
    color: var(--text);
    font-family: 'Hind Siliguri', 'Tiro Bangla', sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .header {
    background: linear-gradient(135deg, var(--maroon), var(--maroon-dark));
    color: var(--cream);
    padding: 28px 20px 24px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: "";
    position: absolute; inset: 0;
    background-image: radial-gradient(circle at 20% 30%, rgba(200,155,60,0.15) 0%, transparent 40%),
                       radial-gradient(circle at 80% 70%, rgba(200,155,60,0.12) 0%, transparent 40%);
  }
  .header h1 {
    margin: 0 0 4px;
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    position: relative;
  }
  .header .sub {
    font-size: 0.85rem;
    opacity: 0.85;
    position: relative;
  }
  .container { max-width: 480px; margin: 0 auto; padding: 16px; }
  .big-date-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px 20px;
    margin-top: -18px;
    position: relative;
    box-shadow: 0 8px 24px rgba(122,46,46,0.08);
    text-align: center;
  }
  .bengali-date {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--maroon);
  }
  .gregorian-date {
    font-size: 0.9rem;
    color: var(--text-soft);
    margin-top: 2px;
  }
  .weekday-pill {
    display: inline-block;
    margin-top: 10px;
    padding: 4px 14px;
    background: var(--gold);
    color: #3b2b05;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 600;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 16px;
  }
  .stat-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
  }
  .stat-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-soft);
    margin-bottom: 4px;
  }
  .stat-value {
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--maroon-dark);
  }
  .stat-detail {
    font-size: 0.75rem;
    color: var(--text-soft);
    margin-top: 2px;
  }
  .sun-row {
    display: flex;
    justify-content: space-between;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 18px;
    margin-top: 10px;
  }
  .sun-item { text-align: center; }
  .sun-item .label { font-size: 0.7rem; color: var(--text-soft); }
  .sun-item .value { font-size: 1rem; font-weight: 600; color: var(--maroon-dark); }
  .nav-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 18px;
  }
  .nav-btn {
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--maroon);
    font-size: 1.1rem;
    width: 40px; height: 40px;
    border-radius: 50%;
    cursor: pointer;
  }
  .loading { text-align: center; padding: 40px; color: var(--text-soft); }
  footer {
    text-align: center;
    font-size: 0.7rem;
    color: var(--text-soft);
    padding: 24px 16px 40px;
  }
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 4px;
  }
  .tab-btn {
    flex: 1;
    padding: 10px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text-soft);
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .tab-btn.active {
    background: var(--maroon);
    color: #fff;
    border-color: var(--maroon);
  }
  .festival-banner {
    margin-top: 10px;
    background: linear-gradient(135deg, var(--gold), #e0b85c);
    color: #3b2b05;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 0.85rem;
    font-weight: 600;
    text-align: center;
  }
  .month-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 14px 0 10px;
  }
  .month-header .label { font-weight: 700; color: var(--maroon-dark); font-size: 1.05rem; }
  .month-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .month-grid .dow {
    text-align: center;
    font-size: 0.65rem;
    color: var(--text-soft);
    padding-bottom: 4px;
  }
  .day-cell {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 2px 6px;
    text-align: center;
    min-height: 54px;
    position: relative;
  }
  .day-cell.festival { border-color: var(--gold); background: #fff8e8; }
  .day-cell .greg { font-size: 0.8rem; font-weight: 700; color: var(--text); }
  .day-cell .bn { font-size: 0.6rem; color: var(--text-soft); margin-top: 1px; line-height: 1.1; }
  .day-cell .dot { position: absolute; top: 3px; right: 4px; width: 5px; height: 5px; border-radius: 50%; background: var(--gold); }
  .empty-cell { visibility: hidden; }
</style>
</head>
<body>
  <div class="header">
    <h1>পঞ্জিকা</h1>
    <div class="sub">Bangla Panjika &amp; Panchang — Kolkata</div>
  </div>

  <div class="container">
    <div class="tabs">
      <button class="tab-btn active" id="tab-day" onclick="switchTab('day')">Today</button>
      <button class="tab-btn" id="tab-month" onclick="switchTab('month')">Month</button>
    </div>
    <div id="content" class="loading">Loading today's panjika…</div>
    <div id="month-view" style="display:none"></div>
  </div>

  <footer>Calculated using Drik Siddhanta (sidereal, Lahiri ayanamsa) · Prototype build</footer>

<script>
const API = "/api/panchang";
let currentDate = new Date();

function fmtDate(d) {
  return d.toISOString().split('T')[0];
}

async function loadPanchang(dateStr) {
  const el = document.getElementById('content');
  el.innerHTML = '<div class="loading">Loading…</div>';
  try {
    const res = await fetch(`${API}?date=${dateStr}`);
    const data = await res.json();
    render(data);
  } catch (e) {
    el.innerHTML = '<div class="loading">Could not load panjika. Is the backend running?</div>';
  }
}

function render(data) {
  const el = document.getElementById('content');
  const bn = data.bengali_date;
  const festivalHtml = data.festival
    ? `<div class="festival-banner">🪔 ${data.festival}</div>`
    : '';
  el.innerHTML = `
    <div class="big-date-card">
      <div class="bengali-date">${bn.day} ${bn.month}, ${bn.bengali_year}</div>
      <div class="gregorian-date">${data.gregorian_date} · ${data.weekday}</div>
      <div class="weekday-pill">${data.weekday_bengali}</div>
    </div>
    ${festivalHtml}

    <div class="nav-row">
      <button class="nav-btn" onclick="changeDay(-1)">‹</button>
      <div style="font-size:0.85rem;color:var(--text-soft)">Swipe days</div>
      <button class="nav-btn" onclick="changeDay(1)">›</button>
    </div>

    <div class="grid">
      <div class="stat-card">
        <div class="stat-label">Tithi</div>
        <div class="stat-value">${data.tithi.name}</div>
        <div class="stat-detail">${data.tithi.paksha} Paksha · ${data.tithi.percent_complete}% elapsed</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Nakshatra</div>
        <div class="stat-value">${data.nakshatra.name}</div>
        <div class="stat-detail">Pada ${data.nakshatra.pada}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Yoga</div>
        <div class="stat-value">${data.yoga.name}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Karana</div>
        <div class="stat-value">${data.karana.name}</div>
      </div>
    </div>

    <div class="sun-row">
      <div class="sun-item">
        <div class="label">Sunrise</div>
        <div class="value">${data.sunrise || '—'}</div>
      </div>
      <div class="sun-item">
        <div class="label">Sunset</div>
        <div class="value">${data.sunset || '—'}</div>
      </div>
    </div>
  `;
}

function changeDay(delta) {
  currentDate.setDate(currentDate.getDate() + delta);
  loadPanchang(fmtDate(currentDate));
}

loadPanchang(fmtDate(currentDate));

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}

// ---- Tabs ----
let monthCursor = new Date();

function switchTab(tab) {
  document.getElementById('tab-day').classList.toggle('active', tab === 'day');
  document.getElementById('tab-month').classList.toggle('active', tab === 'month');
  document.getElementById('content').style.display = tab === 'day' ? 'block' : 'none';
  document.getElementById('month-view').style.display = tab === 'month' ? 'block' : 'none';
  if (tab === 'month') loadMonth(monthCursor.getFullYear(), monthCursor.getMonth() + 1);
}

async function loadMonth(year, month) {
  const el = document.getElementById('month-view');
  el.innerHTML = '<div class="loading">Loading month…</div>';
  try {
    const res = await fetch(`/api/month?year=${year}&month=${month}`);
    const data = await res.json();
    renderMonth(data);
  } catch (e) {
    el.innerHTML = '<div class="loading">Could not load month view.</div>';
  }
}

function renderMonth(data) {
  const el = document.getElementById('month-view');
  const first = new Date(data.year, data.month - 1, 1);
  const startDow = first.getDay(); // 0=Sun
  const monthName = first.toLocaleString('en-US', { month: 'long' });

  let cells = '';
  for (let i = 0; i < startDow; i++) cells += '<div class="day-cell empty-cell"></div>';
  data.days.forEach(day => {
    const dayNum = day.date.split('-')[2];
    const cls = day.festival ? 'day-cell festival' : 'day-cell';
    cells += `
      <div class="${cls}">
        ${day.festival ? '<div class="dot"></div>' : ''}
        <div class="greg">${parseInt(dayNum)}</div>
        <div class="bn">${day.bengali_day} ${day.bengali_month.slice(0,3)}</div>
        <div class="bn">${day.tithi}</div>
      </div>`;
  });

  el.innerHTML = `
    <div class="month-header">
      <button class="nav-btn" onclick="changeMonth(-1)">‹</button>
      <div class="label">${monthName} ${data.year}</div>
      <button class="nav-btn" onclick="changeMonth(1)">›</button>
    </div>
    <div class="month-grid">
      <div class="dow">Su</div><div class="dow">Mo</div><div class="dow">Tu</div>
      <div class="dow">We</div><div class="dow">Th</div><div class="dow">Fr</div><div class="dow">Sa</div>
      ${cells}
    </div>
  `;
}

function changeMonth(delta) {
  monthCursor.setMonth(monthCursor.getMonth() + delta);
  loadMonth(monthCursor.getFullYear(), monthCursor.getMonth() + 1);
}
</script>
</body>
</html>
